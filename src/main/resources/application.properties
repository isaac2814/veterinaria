spring.application.name=veterinaria

# =====================================================================
# Base de datos PostgreSQL (Supabase)
# Credenciales ÚNICAMENTE mediante variables de entorno
# =====================================================================
# Ejemplo de URL directa:
#   jdbc:postgresql://<host>:5432/postgres?sslmode=require
# Si se usa el pooler de Supabase en modo transacción (puerto 6543), agregar prepareThreshold=0:
#   jdbc:postgresql://<host>:6543/postgres?sslmode=require&prepareThreshold=0
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5

# =====================================================================
# JPA / Hibernate
# =====================================================================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# =====================================================================
# Actuator
# =====================================================================
management.endpoints.web.exposure.include=health,info

# =====================================================================
# Swagger UI / OpenAPI
# =====================================================================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
server.forward-headers-strategy=framework

# =====================================================================
# Seguridad para pruebas
# =====================================================================
app.security.abierta=true

server.port=${PORT:8083}
